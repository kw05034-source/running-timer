<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 구름 · 속력 탐구</title>
<link rel="stylesheet" href="./styles.css">
<style>
  /* 단어 구름 화면. 기록 측정·속력 탐구 화면(styles.css)과 같은 구성 요소를 씁니다. */
  .nav { display: flex; align-items: center; gap: 12px; }
  .nav-pill { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 24px; font-size: 17px; font-weight: 800; text-decoration: none; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .nav-pill--home { background: #e5eaf2; color: #17233a; box-shadow: none; font-size: 16px; }
  .nav-pill--speed { background: var(--orange-500); color: #2a1300; }
  .nav-pill--show { background: var(--mint-500); color: var(--navy-950); }
  .main-content { padding-top: 48px; }

  .question { margin: 34px 0 0; padding: clamp(22px, 3vw, 34px); border-radius: 24px; background: var(--navy-900); color: #fff; }
  .question .eyebrow { color: var(--mint-500); margin-bottom: 12px; }
  .question h2 { margin: 0; font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: -0.05em; line-height: 1.25; }
  .question p { margin: 12px 0 0; color: #a9bbd7; font-size: 14px; }

  .cloud-panel { margin-top: 18px; padding: clamp(20px, 3vw, 30px); border: 1px solid var(--line); border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
  .cloud-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .cloud-head h3 { margin: 0; color: var(--navy-900); font-size: 19px; font-weight: 800; letter-spacing: -0.05em; }
  .stat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat-chip { padding: 6px 12px; border-radius: 999px; background: var(--canvas); color: var(--muted); font-size: 13px; font-weight: 800; }
  .stat-chip strong { color: var(--navy-900); }
  .stat-chip--key { background: #fff0e6; color: #b2541a; }
  .stat-chip--key strong { color: #b2541a; }
  /* 구름: 단어마다 자리를 계산해 놓습니다 (words.js의 drawCloud) */
  .cloud { position: relative; height: 380px; margin-top: 14px; overflow: hidden; }
  .cloud span { position: absolute; white-space: nowrap; font-weight: 700; line-height: 1.25; letter-spacing: -0.03em; transition: color 300ms ease; }
  .cloud span.v { writing-mode: vertical-rl; letter-spacing: 0; }
  .cloud span.is-key { font-weight: 900; }
  .cloud span.is-new { animation: pop 420ms ease both; }
  .cloud-empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--muted); font-size: 15px; }
  .cloud-tools { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .highlight-btn { min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--navy-900); font-size: 14px; font-weight: 800; }
  .highlight-btn.is-on { border-color: #f07b2f; background: #fff0e6; color: #b2541a; }
  @keyframes pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

  .legend { margin-top: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13px; font-weight: 700; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; }

  /* 화면에 띄우기: 제목을 숨기고 구름을 크게 */
  body.is-show .question p, body.is-show .hero-copy { display: none; }
  body.is-show .selection-toolbar { margin: 0 0 18px; }
  body.is-show .question { margin-top: 0; }
  body.is-show .cloud { height: 58vh; }

  @media (max-width: 860px) {
    .nav-pill { padding: 12px 16px; font-size: 15px; }
  }
  @media (max-width: 600px) {
    .cloud { height: 320px; }
    .nav { gap: 6px; }
    .nav-pill { padding: 10px 12px; font-size: 13px; }
    .nav-pill--home, .brand-context { display: none; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="./index.html" aria-label="처음 화면으로">
      <span class="brand-mark" aria-hidden="true">☁</span>
      <span><span class="brand-name">단어 구름</span><span class="brand-context">내가 생각하는 자기효능감</span></span>
    </a>
    <nav class="nav">
      <a class="nav-pill nav-pill--home" href="./index.html">🏠 처음으로</a>
      <a class="nav-pill nav-pill--speed" href="./speed.html">⚡ 속력 탐구</a>
      <button type="button" class="nav-pill nav-pill--show" id="show-btn" data-action="toggle-show">📺 화면에 띄우기</button>
    </nav>
  </header>

  <main class="main-content">
    <div class="hero-copy">
      <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span>속력 탐구 · 단어 구름</p>
      <h1>자기효능감이란 뭘까요?<br><span>우리 반 생각이 보여요.</span></h1>
    </div>

    <div class="selection-toolbar">
      <div class="selection-filter">
        <div class="toolbar-heading"><span class="section-label">반 선택</span><span class="toolbar-caption">우리 반을 고르세요</span></div>
        <div class="class-tabs" id="class-tabs" role="tablist" aria-label="반 선택"></div>
      </div>
    </div>

    <!-- 질문과 구름 -->
    <section id="ask-view">
      <div class="question">
        <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span><span id="phase-label">속력 탐구를 마치며</span></p>
        <h2 id="question-text"></h2>
        <p>학생들은 속력 탐구 마지막 단계에서 수업 후 자신감을 매긴 다음 쓴 단어가 여기에 모여요.</p>
      </div>
      <div class="cloud-panel">
        <div class="cloud-head">
          <h3 id="cloud-title">우리 반 단어 구름</h3>
          <div class="stat-chips" id="cloud-stats"></div>
        </div>
        <div class="cloud" id="cloud" aria-live="polite"></div>
        <div class="cloud-tools">
          <button type="button" class="highlight-btn" id="highlight-btn" data-action="toggle-highlight">🔍 탐구 진술 단어 찾기</button>
          <div class="legend" id="legend" hidden></div>
        </div>
      </div>
    </section>

  </main>
</div>
<script src="./words.js"></script>
</body>
</html>
