<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10213e">
<title>랭킹 전광판 | 달리기</title>
<style>
  :root {
    --navy-950: #0d1a31;
    --navy-900: #10213e;
    --navy-800: #173158;
    --navy-700: #274878;
    --blue-500: #4f8cff;
    --blue-100: #eaf1ff;
    --mint-500: #3dd8b0;
    --mint-100: #e3faf4;
    --orange-500: #ff9c5f;
    --orange-100: #fff0e6;
    --gold-500: #ffbf3f;
    --gold-100: #fff5e0;
    --ink: #17233a;
    --muted: #758199;
    --line: #e5eaf2;
    --paper: #ffffff;
    --canvas: #f6f8fc;
    --shadow: 0 18px 50px rgba(23, 49, 88, 0.09);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; background: var(--canvas); }
  body {
    margin: 0;
    min-width: 320px;
    color: var(--ink);
    background: var(--canvas);
    font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { -webkit-tap-highlight-color: transparent; }
  .mono { font-family: 'Cascadia Mono', 'Roboto Mono', monospace; }

  .board-header {
    min-height: 80px;
    padding: 0 max(28px, calc((100vw - 1180px) / 2));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    color: #fff;
    background: var(--navy-900);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    color: inherit;
    text-decoration: none;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: var(--navy-900);
    background: var(--gold-500);
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
  }
  .brand-name { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
  .brand-context { display: block; margin-top: 1px; color: #a7b7d0; font-size: 11px; font-weight: 500; }

  .header-right { display: flex; align-items: center; gap: 22px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #bbcadf;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  .back-link:hover { color: #fff; }
  .clock-block { text-align: right; }
  .clock { font-family: 'Cascadia Mono', 'Roboto Mono', monospace; font-size: 20px; font-weight: 500; letter-spacing: -0.04em; }
  .updated-at { margin-top: 2px; color: #8ea2c1; font-size: 11px; }

  .main-content {
    width: min(1180px, calc(100% - 56px));
    margin: 0 auto;
    padding: 44px 0 70px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 19px 22px 19px 26px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--paper);
    box-shadow: 0 8px 30px rgba(23, 49, 88, 0.04);
  }
  .class-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .tab-btn {
    min-width: 58px;
    min-height: 40px;
    padding: 0 16px;
    border: 0;
    border-radius: 9px;
    color: var(--muted);
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.04em;
    cursor: pointer;
    transition: color 160ms ease, background 160ms ease, transform 160ms ease;
  }
  .tab-btn:hover { color: var(--navy-900); background: var(--blue-100); }
  .tab-btn:active { transform: scale(0.97); }
  .tab-btn.is-selected { color: #fff; background: var(--navy-900); }

  .mode-switch { display: flex; gap: 6px; padding: 4px; border-radius: 11px; background: var(--canvas); }
  .mode-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: color 160ms ease, background 160ms ease;
  }
  .mode-btn.is-selected { color: var(--navy-900); background: var(--gold-500); }

  .list-heading {
    margin: 40px 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: end;
  }
  .list-heading h1 { margin: 0; color: var(--navy-900); font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; letter-spacing: -0.06em; }
  .list-heading p { margin: 6px 0 0; color: var(--muted); font-size: 13px; letter-spacing: -0.03em; }

  .podium {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: end;
    gap: 16px;
    margin-bottom: 40px;
  }
  .podium-item { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .podium-item.is-empty { visibility: hidden; }
  .podium-medal { font-size: 30px; line-height: 1; margin-bottom: 8px; }
  .podium-avatar {
    width: 68px;
    height: 68px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--blue-500);
    background: var(--blue-100);
    font-size: 26px;
    font-weight: 800;
    border: 3px solid var(--paper);
    box-shadow: 0 6px 18px rgba(23, 49, 88, 0.12);
    margin-bottom: 12px;
  }
  .podium-name { color: var(--navy-900); font-size: 17px; font-weight: 800; letter-spacing: -0.04em; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .podium-meta { color: var(--muted); font-size: 11px; font-weight: 500; margin: 0 0 10px; }
  .podium-value { font-family: 'Cascadia Mono', 'Roboto Mono', monospace; font-weight: 500; letter-spacing: -0.04em; color: var(--navy-900); }
  .podium-value small { margin-left: 3px; font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size: 11px; color: var(--muted); font-weight: 600; }
  .podium-base {
    width: 100%;
    margin-top: 14px;
    border-radius: 14px 14px 0 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10px;
    font-family: 'Cascadia Mono', 'Roboto Mono', monospace;
    font-size: 15px;
    font-weight: 800;
  }
  .podium-1 .podium-avatar { width: 84px; height: 84px; font-size: 32px; border-color: var(--gold-500); }
  .podium-1 .podium-value { font-size: 30px; }
  .podium-1 .podium-base { height: 128px; background: linear-gradient(180deg, var(--gold-100), #ffe6ad); color: #9a6a00; }
  .podium-2 .podium-avatar { border-color: #cfd8e3; }
  .podium-2 .podium-value { font-size: 22px; }
  .podium-2 .podium-base { height: 92px; background: linear-gradient(180deg, #f1f3f7, #dde3ec); color: #5b6779; }
  .podium-3 .podium-avatar { border-color: var(--orange-500); }
  .podium-3 .podium-value { font-size: 22px; }
  .podium-3 .podium-base { height: 72px; background: linear-gradient(180deg, var(--orange-100), #ffd3ac); color: #8a4c1c; }

  .rest-heading { margin: 4px 0 14px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: -0.02em; }
  .rank-list { display: grid; gap: 10px; }
  .rank-row {
    display: grid;
    grid-template-columns: 56px 48px 1fr auto auto;
    align-items: center;
    gap: 18px;
    padding: 16px 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--paper);
    box-shadow: 0 8px 25px rgba(23, 49, 88, 0.035);
    transition: transform 180ms ease, box-shadow 180ms ease;
  }
  .rank-row.rank-1 { border-color: #ffdc94; background: linear-gradient(90deg, var(--gold-100), var(--paper) 55%); }
  .rank-row.rank-2 { border-color: #cfd8e3; background: linear-gradient(90deg, #eef1f6, var(--paper) 55%); }
  .rank-row.rank-3 { border-color: #f3c9a1; background: linear-gradient(90deg, var(--orange-100), var(--paper) 55%); }

  .rank-number { color: var(--muted); font-size: 22px; font-weight: 800; text-align: center; font-family: 'Cascadia Mono', 'Roboto Mono', monospace; }
  .rank-1 .rank-number { color: var(--gold-500); }
  .rank-2 .rank-number { color: #9aa7ba; }
  .rank-3 .rank-number { color: var(--orange-500); }

  .avatar {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    color: var(--blue-500);
    background: var(--blue-100);
    font-size: 17px;
    font-weight: 800;
  }
  .rank-row:nth-child(3n + 2) .avatar { color: #0eae89; background: var(--mint-100); }
  .rank-row:nth-child(3n + 3) .avatar { color: #e87d38; background: var(--orange-100); }

  .student-info { min-width: 0; }
  .student-name { margin: 0 0 2px; color: var(--navy-900); font-size: 18px; font-weight: 800; letter-spacing: -0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .student-meta { color: var(--muted); font-size: 12px; font-weight: 500; }

  .stat-block { text-align: right; min-width: 92px; }
  .stat-value { color: var(--navy-900); font-family: 'Cascadia Mono', 'Roboto Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: -0.05em; }
  .stat-value small { margin-left: 3px; color: var(--muted); font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size: 12px; font-weight: 600; }
  .stat-label { margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .stat-block.secondary .stat-value { font-size: 16px; color: var(--navy-800); }

  .empty-board {
    padding: 60px 20px;
    border: 1px dashed #cdd6e4;
    border-radius: var(--radius-md);
    color: var(--muted);
    text-align: center;
    font-size: 14px;
  }
  .error-banner {
    padding: 14px 18px;
    border: 1px solid #f7c9c9;
    border-radius: var(--radius-sm);
    background: #fff3f3;
    color: #d1454a;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .loading-banner { padding: 14px 0; color: var(--muted); font-size: 13px; }

  @media (max-width: 720px) {
    .board-header { padding: 0 18px; min-height: 68px; }
    .header-right { gap: 12px; }
    .main-content { width: min(100% - 32px, 600px); padding: 32px 0 45px; }
    .controls { flex-direction: column; align-items: stretch; padding: 16px; }
    .rank-row { grid-template-columns: 40px 36px 1fr auto; }
    .stat-block.secondary { display: none; }
    .podium { gap: 8px; }
    .podium-name { max-width: 96px; font-size: 14px; }
    .podium-meta { font-size: 10px; }
    .podium-1 .podium-avatar { width: 64px; height: 64px; font-size: 24px; }
    .podium-avatar { width: 52px; height: 52px; font-size: 18px; }
    .podium-1 .podium-value { font-size: 22px; }
    .podium-2 .podium-value, .podium-3 .podium-value { font-size: 16px; }
    .podium-1 .podium-base { height: 90px; }
    .podium-2 .podium-base { height: 66px; }
    .podium-3 .podium-base { height: 50px; }
  }
</style>
</head>
<body>
  <header class="board-header">
    <a class="brand" href="./index.html">
      <span class="brand-mark" aria-hidden="true">🏆</span>
      <span>
        <span class="brand-name">랭킹 전광판</span>
        <span class="brand-context">장애물달리기 · 실시간 순위</span>
      </span>
    </a>
    <div class="header-right">
      <a class="back-link" href="./index.html"><span aria-hidden="true">←</span> 학생 선택으로</a>
      <div class="clock-block">
        <div class="clock" id="clock">--:--:--</div>
        <div class="updated-at" id="updated-at">불러오는 중...</div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="controls">
      <div class="class-tabs" id="class-tabs" role="tablist" aria-label="반 선택"></div>
      <div class="mode-switch" role="tablist" aria-label="랭킹 기준">
        <button class="mode-btn is-selected" type="button" data-mode="best">최고기록 랭킹</button>
        <button class="mode-btn" type="button" data-mode="attempts">도전횟수 랭킹</button>
      </div>
    </div>

    <div class="list-heading">
      <div>
        <h1 id="board-title">기록 랭킹</h1>
        <p>10초마다 자동으로 갱신돼요.</p>
      </div>
    </div>

    <div id="banner"></div>
    <div class="podium" id="podium"></div>
    <p class="rest-heading" id="rest-heading" hidden>4등부터</p>
    <div class="rank-list" id="rank-list"></div>
  </main>

<script>
(() => {
  'use strict';

  // app.js와 동일한 Apps Script 배포 주소
  const SHEETS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw5mlmLxwSTXB7q7lsbqlGjWfkU9aTUwmwFSKeiK_Y9OyDX-eqx51AAkayE6qtAkCQS/exec';
  const REFRESH_INTERVAL_MS = 10000;
  const ACTIVITY_TYPE = 'obstacle_run';

  const classTabsEl = document.getElementById('class-tabs');
  const podiumEl = document.getElementById('podium');
  const restHeadingEl = document.getElementById('rest-heading');
  const rankListEl = document.getElementById('rank-list');
  const boardTitleEl = document.getElementById('board-title');
  const updatedAtEl = document.getElementById('updated-at');
  const bannerEl = document.getElementById('banner');
  const clockEl = document.getElementById('clock');

  const state = {
    students: [],
    records: [],
    availableClasses: [],
    selectedClass: 'all',
    mode: 'best'
  };

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
  }

  function formatSeconds(seconds) {
    return Number(seconds || 0).toFixed(2);
  }

  function tickClock() {
    clockEl.textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  }

  function renderClassTabs() {
    const tabs = ['all', ...state.availableClasses];
    classTabsEl.innerHTML = tabs.map((cls) => {
      const label = cls === 'all' ? '전체' : `${cls}반`;
      const selected = cls === state.selectedClass;
      return `<button class="tab-btn${selected ? ' is-selected' : ''}" type="button" data-class="${cls}" aria-selected="${selected}">${label}</button>`;
    }).join('');
  }

  function computeStudentStats() {
    const recordsByStudent = new Map();
    state.records
      .filter((r) => r.activity_type === ACTIVITY_TYPE)
      .forEach((r) => {
        const list = recordsByStudent.get(String(r.student_id)) || [];
        list.push(r);
        recordsByStudent.set(String(r.student_id), list);
      });

    return state.students
      .filter((s) => state.selectedClass === 'all' || Number(s.class) === Number(state.selectedClass))
      .map((s) => {
        const list = recordsByStudent.get(String(s.student_id)) || [];
        const times = list.map((r) => Number(r.record_seconds));
        const best = times.length ? Math.min(...times) : null;
        return { student: s, attempts: list.length, best };
      });
  }

  function primaryValueOf(entry) {
    return state.mode === 'best'
      ? (entry.best === null ? '—' : `${formatSeconds(entry.best)}<small>초</small>`)
      : `${entry.attempts}<small>회</small>`;
  }

  function secondaryOf(entry) {
    return state.mode === 'best'
      ? { label: '연습 횟수', value: `${entry.attempts}회` }
      : { label: '최고기록', value: entry.best === null ? '—' : `${formatSeconds(entry.best)}초` };
  }

  function renderPodium(top3) {
    if (top3.length === 0) {
      podiumEl.innerHTML = '';
      return;
    }
    // 화면 배치 순서: 2등 - 1등 - 3등
    const order = [top3[1], top3[0], top3[2]];
    const medals = ['🥈', '🥇', '🥉'];
    const positionClasses = ['podium-2', 'podium-1', 'podium-3'];
    const positionLabels = ['2', '1', '3'];

    podiumEl.innerHTML = order.map((entry, i) => {
      if (!entry) {
        return `<div class="podium-item ${positionClasses[i]} is-empty"></div>`;
      }
      const s = entry.student;
      return `
        <div class="podium-item ${positionClasses[i]}">
          <div class="podium-medal">${medals[i]}</div>
          <div class="podium-avatar" aria-hidden="true">${escapeHtml(String(s.name).slice(0, 1))}</div>
          <p class="podium-name">${escapeHtml(s.name)}</p>
          <p class="podium-meta">${escapeHtml(s.class)}반 · ${escapeHtml(s.group_or_team)} · ${escapeHtml(s.number)}번</p>
          <div class="podium-value">${primaryValueOf(entry)}</div>
          <div class="podium-base">${positionLabels[i]}</div>
        </div>`;
    }).join('');
  }

  function renderRestList(rest, startRank) {
    if (rest.length === 0) {
      restHeadingEl.hidden = true;
      rankListEl.innerHTML = '';
      return;
    }
    restHeadingEl.hidden = false;
    restHeadingEl.textContent = `${startRank}등부터`;

    rankListEl.innerHTML = rest.map((entry, index) => {
      const rank = startRank + index;
      const s = entry.student;
      const secondary = secondaryOf(entry);

      return `
        <div class="rank-row">
          <div class="rank-number">${rank}</div>
          <div class="avatar" aria-hidden="true">${escapeHtml(String(s.name).slice(0, 1))}</div>
          <div class="student-info">
            <p class="student-name">${escapeHtml(s.name)}</p>
            <p class="student-meta">${escapeHtml(s.class)}반 · ${escapeHtml(s.group_or_team)} · ${escapeHtml(s.number)}번</p>
          </div>
          <div class="stat-block">
            <div class="stat-value">${primaryValueOf(entry)}</div>
            <div class="stat-label">${state.mode === 'best' ? '최고기록' : '도전횟수'}</div>
          </div>
          <div class="stat-block secondary">
            <div class="stat-value">${secondary.value}</div>
            <div class="stat-label">${secondary.label}</div>
          </div>
        </div>`;
    }).join('');
  }

  function renderBoard() {
    boardTitleEl.textContent = state.mode === 'best' ? '기록 랭킹' : '도전횟수 랭킹';
    const stats = computeStudentStats();

    let sorted;
    if (state.mode === 'best') {
      const withRecord = stats.filter((s) => s.best !== null).sort((a, b) => a.best - b.best);
      const withoutRecord = stats.filter((s) => s.best === null);
      sorted = [...withRecord, ...withoutRecord];
    } else {
      sorted = [...stats].sort((a, b) => b.attempts - a.attempts);
    }

    if (sorted.length === 0) {
      podiumEl.innerHTML = '';
      restHeadingEl.hidden = true;
      rankListEl.innerHTML = '<div class="empty-board">해당 반에 학생 데이터가 없어요.</div>';
      return;
    }

    const top3 = sorted.slice(0, 3);
    const rest = sorted.slice(3);
    renderPodium(top3);
    renderRestList(rest, 4);
  }

  async function fetchJson(url) {
    const response = await fetch(url);
    const result = await response.json();
    if (!result.ok) {
      throw new Error(result.error && result.error.message ? result.error.message : '데이터를 불러오지 못했습니다.');
    }
    return result.data;
  }

  async function loadData() {
    try {
      const [students, records] = await Promise.all([
        fetchJson(`${SHEETS_ENDPOINT}?action=students`),
        fetchJson(`${SHEETS_ENDPOINT}?action=records`)
      ]);
      state.students = students;
      state.records = records;
      state.availableClasses = [...new Set(students.map((s) => Number(s.class)))]
        .filter((c) => Number.isInteger(c))
        .sort((a, b) => a - b);
      bannerEl.innerHTML = '';
      renderClassTabs();
      renderBoard();
      updatedAtEl.textContent = `마지막 업데이트 ${new Date().toLocaleTimeString('ko-KR', { hour12: false })}`;
    } catch (error) {
      console.error('랭킹 데이터를 불러오지 못했습니다.', error);
      bannerEl.innerHTML = `<div class="error-banner">데이터를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. (${escapeHtml(error.message)})</div>`;
    }
  }

  classTabsEl.addEventListener('click', (event) => {
    const btn = event.target.closest('.tab-btn');
    if (!btn) return;
    state.selectedClass = btn.dataset.class === 'all' ? 'all' : Number(btn.dataset.class);
    renderClassTabs();
    renderBoard();
  });

  document.querySelector('.mode-switch').addEventListener('click', (event) => {
    const btn = event.target.closest('.mode-btn');
    if (!btn) return;
    state.mode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('is-selected', b === btn));
    renderBoard();
  });

  bannerEl.innerHTML = '<div class="loading-banner">데이터를 불러오는 중이에요...</div>';
  tickClock();
  setInterval(tickClock, 1000);
  loadData();
  setInterval(loadData, REFRESH_INTERVAL_MS);
})();
</script>
</body>
</html>
